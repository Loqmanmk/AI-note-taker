name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # The mobile app shares code from ../lib, which needs the root dependencies.
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      # Called directly, not as a package.json script: scripts are part of the app's fingerprint,
      # and changing them would stop over-the-air updates from reaching installed apps.
      - run: node ../node_modules/vitest/vitest.mjs run
        working-directory: mobile
